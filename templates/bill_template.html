<!DOCTYPE html>
<html>
<head>
    <title>Bill</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 80%;
            margin: 0 auto;
            padding: 20px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 2rem;
            margin: 0;
        }
        .header p {
            font-size: 1rem;
            color: #666;
        }
        .content {
            margin-bottom: 20px;
        }
        .content p {
            font-size: 1.1rem;
            margin: 5px 0;
        }
        .content p strong {
            color: #333;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
        }
        .footer p {
            font-size: 1rem;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Payment Bill</h1>
            <p>Date: {{ now.strftime('%Y-%m-%d %H:%M:%S') }}</p>
        </div>
        <div class="content">
            <p><strong>Sponsor:</strong> {{ sponsor.company_name }}</p>
            <p><strong>Influencer:</strong> {{ influencer.username }}</p>
            <p><strong>Campaign:</strong> {{ campaign.name }}</p>
            <p><strong>Budget:</strong> ${{ campaign.budget }}</p>
        </div>
        <div class="footer">
            <p>Thank you for your payment.</p>
        </div>
    </div>
</body>
</html>
