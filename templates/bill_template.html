<!DOCTYPE html>
<html>
<head>
    <title>Bill</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .container { width: 80%; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 20px; }
        .content { margin-bottom: 20px; }
        .footer { text-align: center; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Payment Bill</h1>
            <p>Date: {{ now.strftime('%Y-%m-%d %H:%M:%S') }}</p>
        </div>
        <div class="content">
            <p><strong>Sponsor:</strong> {{ sponsor.company_name }}</p>
            <p><strong>Influencer:</strong> {{ influencer.username }}</p>
            <p><strong>Campaign:</strong> {{ campaign.name }}</p>
            <p><strong>Budget:</strong> ${{ campaign.budget }}</p>
        </div>
        <div class="footer">
            <p>Thank you for your payment.</p>
        </div>
    </div>
</body>
</html>
