{% extends 'layout.html' %}

{% block content %}
<div class="container mt-5">
    <h1 class="mb-4">Add Campaign</h1>
    <hr>
    <form action="" method="post" class="add-campaign-form">
        <div class="mb-3">
            <label class="form-label" for="name">Campaign Name:</label>
            <input class="form-control" type="text" name="name" id="name" maxlength="15" placeholder="Enter campaign name">
        </div>
        
        <div class="mb-3">
            <label class="form-label" for="description">Description:</label>
            <textarea name="description" id="description" cols="30" rows="5" maxlength="250" class="form-control" placeholder="Enter campaign description"></textarea>
        </div>
        
        <div class="mb-3">
            <label class="form-label" for="start_date">Start Date:</label>
            <input class="form-control" type="date" name="start_date" id="start_date">
        </div>
        
        <div class="mb-3">
            <label class="form-label" for="end_date">End Date:</label>
            <input class="form-control" type="date" name="end_date" id="end_date">
        </div>

        <div class="mb-3">
            <label class="form-label" for="budget">Payment:</label>
            <input class="form-control" type="number" name="budget" id="budget" placeholder="Enter budget">
        </div>

        <div class="mb-3">
            <label class="form-label" for="visibility">Visibility:</label>
            <select class="form-select" id="choice" name="visibility">
                <option value="public" selected>Public</option>
                <option value="private">Private</option>
            </select>
        </div>
        
        <div class="mb-3">
            <label class="form-label" for="goals">Goals:</label>
            <input class="form-control" type="text" name="goals" id="goals" maxlength="50" placeholder="Enter campaign goals">
        </div>
        
        <button type="submit" class="btn btn-success">
            <i class="fa fa-plus" aria-hidden="true"></i> Create
        </button>
    </form>
</div>
{% endblock %}
