{% extends "layout.html" %}

{% block content %}
<div class="profilecard">
    <div class="profileinfo">
        <h1>{{ user.username }}</h1>
        <p>{{sponsor.name}}</p>
        <p>{{sponsor.company}}</p>
        <p>{{sponsor.industry}}</p>
        <p>{{sponsor.budget}}</p>
        <p>{{ user.email }}</p>
        <a href="{{ url_for('update_profile') }}" class="btn btn-primary">Update Profile</a>
    </div>
</div>
{% endblock %}
