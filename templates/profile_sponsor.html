{% extends "layout.html" %}

{% block content %}
<style>
    .profile-card {
        max-width: 600px;
        margin: auto;
    }
    .profile-card h1 {
        font-size: 2.5rem;
        color: #007bff;
    }
    .profile-card p {
        font-size: 1.25rem;
        color: #6c757d;
    }
    .profile-card .btn {
        margin-top: 20px;
    }
</style>

<div class="container my-4">
    <div class="card shadow-sm profile-card">
        <div class="card-body text-center">
            <h1 class="card-title">{{ user.username }}</h1>
            <p>{{sponsor.name}}</p>
            <p>{{sponsor.company}}</p>
            <p>{{sponsor.industry}}</p>
            <p>{{sponsor.budget}}</p>
            <p>{{ user.email }}</p>
            <a href="{{ url_for('update_profile') }}" class="btn btn-primary">Update Profile</a>
        </div>
    </div>
</div>
{% endblock %}
