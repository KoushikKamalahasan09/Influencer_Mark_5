{% extends 'layout.html' %}

{% block content %}
<style>
    .profile-form {
        max-width: 600px;
        margin: auto;
        padding: 20px;
        background-color: #f8f9fa;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    .profile-form .form-label {
        font-weight: bold;
        color: #007bff;
    }
    .profile-form .btn {
        width: 100%;
    }
</style>

<div class="container my-4">
    <form action="" method="post" class="profile-form">
        <h3 class="text-center mb-4">Update Profile</h3>

        <label class="form-label" for="username">Username:</label>
        <input class="form-control mb-3" type="text" name="username" id="username" value="{{ user.username }}">

        <label class="form-label" for="email">Email:</label>
        <input class="form-control mb-3" type="text" name="email" id="email" value="{{ user.email }}">

        <label class="form-label" for="company_name">Name of Company:</label>
        <input class="form-control mb-3" type="text" name="company_name" id="company_name" value="{{ sponsor.company_name }}">

        <label class="form-label" for="individual_name">Name of Individual:</label>
        <input class="form-control mb-3" type="text" name="individual_name" id="individual_name" value="{{ sponsor.individual_name }}">

        <label class="form-label" for="budget">Budget:</label>
        <input class="form-control mb-3" type="number" name="budget" id="budget" value="{{ sponsor.budget }}">

        <label class="form-label" for="industry">Industry:</label>
        <input class="form-control mb-3" type="text" name="industry" id="industry" value="{{ sponsor.industry }}">

        <label class="form-label" for="password">Current Password:</label>
        <input class="form-control mb-3" type="password" name="password" id="password">

        <label class="form-label" for="npassword">New Password:</label>
        <input class="form-control mb-3" type="password" name="npassword" id="npassword">

        <button class="btn btn-primary" type="submit">Change</button>
    </form>

    <form action="{{ url_for('delete_sponsor_confirmation') }}" method="GET" class="mt-3">
        <button class="btn btn-danger w-100" type="submit">Delete Account</button>
    </form>
</div>
{% endblock %}
