{% extends 'layout.html' %}

{% block content %}

<form action="" method="post" class="profile-form">


    <label class="form-label" for="username">Username:</label>
    <input class="form-control" type="text" name="username" id="username" value="{{ user.username }}">

    <label class="form-label" for="email">Email:</label>
    <input class="form-control" type="text" name="email" id="email" value="{{ user.email }}">

    <label class="form-label" for="company_name">Name of Company:</label>
    <input class="form-control" type="text" name="company_name" id="company_name" value="{{ sponsor.company_name }}">

    <label class="form-label" for="individual_name">Name of Individual:</label>
    <input class="form-control" type="text" name="individual_name" id="individual_name" value="{{ sponsor.individual_name }}">

    <label class="form-label" for="budget">Budget:</label>
    <input class="form-control" type="number" name="budget" id="budget" value="{{ sponsor.budget }}">

    <label class="form-label" for="industry">Industry:</label>
    <input class="form-control" type="text" name="industry" id="industry" value="{{ sponsor.industry }}">

    <label class="form-label" for="password">Current Password:</label>
    <input class="form-control" type="password" name="password" id="password">

    <label class="form-label" for="npassword">New Password:</label>
    <input class="form-control" type="password" name="npassword" id="npassword">



    <button class="btn btn-primary" type="submit">Change</button>
</form>

{% endblock %}
