{% extends "layout.html" %}

{% block content %}
<div class="profilecard">
    <div class="profileinfo">
        <h1>{{ user.username }}</h1>
        <p>{{influencer.name}}</p>
        <p>{{influencer.category}}</p>
        <p>{{influencer.platform}}</p>
        <p>{{influencer.reach}}</p>
        <p>{{ user.email }}</p>
        <a href="{{ url_for('update_profile') }}" class="btn btn-primary">Update Profile</a>
    </div>
</div>
{% endblock %}
