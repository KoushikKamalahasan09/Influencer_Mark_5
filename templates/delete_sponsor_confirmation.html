{% extends 'layout.html' %}

{% block content %}
<div class="container">
    <h2>Confirm Account Deletion</h2>
    <p>Are you sure you want to delete your account and all associated campaigns? This action cannot be undone.</p>
    <form action="{{ url_for('delete_profile') }}" method="POST">
        <button class="btn btn-danger" type="submit">Delete Account</button>
        <a href="{{ url_for('update_profile') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
