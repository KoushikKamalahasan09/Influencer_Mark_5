{% extends "layout.html" %}

{% block content %}
<div class="container">
    <h2>Edit Campaign</h2>
    <form method="POST" action="{{ url_for('edit_campaign', campaign_id=campaign.id) }}">
        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" class="form-control" id="title" name="title" value="{{ campaign.title }}" required>
        </div>
        <div class="form-group">
            <label for="description">Description</label>
            <textarea class="form-control" id="description" name="description" required>{{ campaign.description }}</textarea>
        </div>
        <!-- Add more fields as needed -->
        <button type="submit" class="btn btn-primary">Update Campaign</button>
    </form>
</div>
{% endblock %}
