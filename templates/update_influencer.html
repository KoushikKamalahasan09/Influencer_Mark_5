{% extends 'layout.html' %}

{% block content %}

<form action="" method="post" class="profile-form">


    <label class="form-label" for="username">Username:</label>
    <input class="form-control" type="text" name="username" id="username" value="{{ user.username }}">

    <label class="form-label" for="email">Email:</label>
    <input class="form-control" type="text" name="email" id="email" value="{{ user.email }}">

    <label class="form-label" for="individual_name">Name of Individual:</label>
    <input class="form-control" type="text" name="individual_name" id="individual_name" value="{{ influencer.name }}">

    <label class="form-label" for="category">Category:</label>
    <input class="form-control" type="text" name="category" id="category" value="{{ influencer.category }}">

    <label class="form-label" for="platform">Platform:</label>
    <input class="form-control" type="text" name="platform" id="platform" value="{{ influencer.platform }}">

    <label class="form-label" for="reach">Number of Followers:</label>
    <input class="form-control" type="number" name="reach" id="reach" value="{{ influencer.reach }}">

    <label class="form-label" for="password">Current Password:</label>
    <input class="form-control" type="password" name="password" id="password">

    <label class="form-label" for="npassword">New Password:</label>
    <input class="form-control" type="password" name="npassword" id="npassword">



    <button class="btn btn-primary" type="submit">Change</button>
</form>

{% endblock %}
