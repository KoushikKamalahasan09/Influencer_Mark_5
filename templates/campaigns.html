{% extends "layout.html" %}

{% block content %}
<div class="container">
    <h2>Manage Campaigns</h2>
    <a href="{{ url_for('add_campaign') }}" class="btn btn-primary">Add Campaign</a>
    <table class="table mt-3">
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Description</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for campaign in campaigns %}
            <tr>
                <td>{{ campaign.id }}</td>
                <td>{{ campaign.title }}</td>
                <td>{{ campaign.description }}</td>
                <td>
                    <a href="{{ url_for('edit_campaign', campaign_id=campaign.id) }}" class="btn btn-secondary">Edit</a>
                    <form action="{{ url_for('delete_campaign', campaign_id=campaign.id) }}" method="POST" style="display:inline;">
                        <button type="submit" class="btn btn-danger">Delete</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
